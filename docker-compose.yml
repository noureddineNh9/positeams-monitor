services:
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION:-2}
    container_name: uptime-kuma
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      - "${UPTIME_KUMA_BIND_ADDRESS:-127.0.0.1}:${UPTIME_KUMA_PORT:-3001}:3001"

    environment:
      TZ: ${TZ:-Africa/Casablanca}

    volumes:
      - uptime-kuma-data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uptime-kuma-data:
    name: ${UPTIME_KUMA_VOLUME_NAME:-uptime-kuma-data}
